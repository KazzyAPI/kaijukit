name: kaijukit

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kk
      POSTGRES_PASSWORD: kk
      POSTGRES_DB: kk
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kk -d kk"]
      interval: 2s
      timeout: 3s
      retries: 30

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["--migrate"]
    environment:
      KK_DATABASE_URL: postgres://kk:kk@postgres:5432/kk
      KK_BIND: 0.0.0.0:8080
      KK_BASE_URL: http://localhost:${KK_PORT:-8080}
      KK_BLOB_DIR: /data/blobs
      KK_ADMIN_EMAIL: ${KK_ADMIN_EMAIL:-admin@kaijukit.local}
      KK_ADMIN_TOKEN: ${KK_ADMIN_TOKEN:-kk-dev-token}
    ports:
      - "${KK_PORT:-8080}:8080"
    volumes:
      - blobs:/data/blobs
    depends_on:
      postgres:
        condition: service_healthy

  # web:
  #   build: { context: .., dockerfile: web/Dockerfile }
  #   ports: ["3000:80"]
  #   depends_on: [server]

volumes:
  pgdata:
  blobs:
